services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: krylya
      POSTGRES_USER: krylya
      POSTGRES_PASSWORD: ${KRYLYA_DB_PASSWORD:?Set KRYLYA_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krylya -d krylya"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    profiles: ["maintenance"]
    build: .
    command: ["--migrate"]
    environment:
      ConnectionStrings__Krylya: Host=postgres;Database=krylya;Username=krylya;Password=${KRYLYA_DB_PASSWORD:?Set KRYLYA_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__Krylya: Host=postgres;Database=krylya;Username=krylya_app;Password=${KRYLYA_RUNTIME_PASSWORD:?Set KRYLYA_RUNTIME_PASSWORD}
    volumes:
      - data-protection:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  proxy:
    image: caddy:2
    environment:
      KRYLYA_HOST: ${KRYLYA_HOST:?Set KRYLYA_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
  data-protection:
  caddy-data:
  caddy-config:
