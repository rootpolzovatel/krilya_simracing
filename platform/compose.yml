services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: krylya
      POSTGRES_USER: krylya
      POSTGRES_PASSWORD: ${KRYLYA_DB_PASSWORD:?Set KRYLYA_DB_PASSWORD}
    ports:
      - "127.0.0.1:${KRYLYA_DB_PORT:-54329}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krylya -d krylya"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
